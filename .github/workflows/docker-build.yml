name: Docker Build and Push

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write # Required to push on GHCR

        steps:
            # 1. Clone the repository code into the runner
            - name: Checkout Code
              uses: actions/checkout@v4

            # 2. Set up Docker Buildx (advanced Docker build engine)
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 3. Login to GitHub Container Registry
            - name: Login to GHCR
              # Only login on push, not PR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            
            # 4. Build Docker Image (and push if not PR)
            - name: Build and push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ghcr.io/gmartin-data/nyc-taxi-app:latest
                  cache-from: type=gha # Use GitHub Actions cache to restore layers
                  cache-to: type=gha,mode=max # Save all layers to cache (max mode)